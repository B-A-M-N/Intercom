[project]
name = "intercom-adapter"
version = "0.1.0"
description = "Intercom adapter host: harness-specific integration for the Intercom protocol"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
intercom-adapter = "intercom_adapter.host:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["intercom_adapter*"]
